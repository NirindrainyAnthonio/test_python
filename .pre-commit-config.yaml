repos:
  # Formatage du code avec Black
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  # Organisation des imports avec isort
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        name: isort (python)
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.11
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  # Analyse de sécurité statique avec Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-f", "json"]

  # Vérification des vulnérabilités des dépendances avec Safety
  - repo: local
    hooks:
      - id: safety-scan
        name: safety scan
        entry: safety
        language: system
        pass_filenames: false
        args: ["scan", "-r", "requirements.txt"]

  # Analyse de code et détection de vulnérabilités avec Semgrep
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.134.0'
    hooks:
      - id: semgrep-ci

  # Nettoie les espaces inutiles, assure une fin de fichier correcte.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json


  # Vérification du style et linting avec Flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]  # Optionnel pour plus de règles
